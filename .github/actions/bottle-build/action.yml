name: Bottle build
description: Build (and optionally upload) a Homebrew bottle for a Pake desktop formula
inputs:
  formula:
    description: Formula name (e.g. deepseek-harness-desktop)
    required: true
  upload:
    description: Whether to upload the bottle and update the formula block
    required: false
    default: 'false'
  root-url:
    description: Root URL for the bottle
    required: false
    default: 'https://github.com/coetzeestroom/homebrew-octavo/releases/download/bottles'
runs:
  using: composite
  steps:
    - name: Prepare runner build space
      shell: bash
      run: |
        set -euo pipefail
        echo "Disk space before cleanup:"
        df -hT / /mnt

        # These Pake builds need Rust, Node, Python and WebKitGTK, but not the
        # preinstalled Android, .NET, Haskell or CodeQL toolchains. Removing
        # them frees the root filesystem before Homebrew expands its bottles.
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
          /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/*
        docker image prune --all --force || true

        # Homebrew uses /var/tmp on Linux by default. Its buildpath contains
        # Pake's Cargo target and registry cache, so place it on the runner's
        # separate temporary volume instead of the saturated root filesystem.
        sudo mkdir -p /mnt/homebrew-tmp
        sudo chown "$(id -u):$(id -g)" /mnt/homebrew-tmp
        echo "HOMEBREW_TEMP=/mnt/homebrew-tmp" >> "$GITHUB_ENV"
        echo "TMPDIR=/mnt/homebrew-tmp" >> "$GITHUB_ENV"

        echo "Disk space after cleanup:"
        df -hT / /mnt

    - name: Install system build deps
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential pkg-config libwebkit2gtk-4.1-dev libssl-dev \
          libayatana-appindicator3-dev librsvg2-dev libxdo-dev rustc cargo
        sudo mkdir -p "$HOME/.cargo"
        sudo chown -R "$(id -u):$(id -g)" "$HOME/.cargo"

    - name: Install with --build-bottle
      shell: bash
      run: HOMEBREW_NO_AUTO_UPDATE=1 brew install --build-bottle coetzeestroom/octavo/${{ inputs.formula }}

    - name: Run formula tests (early validation)
      shell: bash
      run: brew test coetzeestroom/octavo/${{ inputs.formula }}

    - name: Build bottle
      shell: bash
      run: |
        brew bottle --json --no-rebuild \
          --root-url "${{ inputs.root-url }}" \
          coetzeestroom/octavo/${{ inputs.formula }}

    - name: Check idempotency
      if: inputs.upload == 'true'
      id: idempotency
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        FORMULA: ${{ inputs.formula }}
      run: |
        set -euo pipefail
        json=$(ls ./*.bottle.json)
        filename=$(jq -r '.[].bottle.tags.x86_64_linux.filename' "$json")
        sha256=$(jq -r '.[].bottle.tags.x86_64_linux.sha256' "$json")
        assets_tsv="${RUNNER_TEMP:-/tmp}/bottle-assets.tsv"

        if [[ -z "${sha256}" || "${sha256}" == "null" ]]; then
          echo "Could not read the bottle checksum from ${json}" >&2
          exit 1
        fi

        # A published bottle is only usable when the release asset and the
        # sha256 in the formula agree, so the two are gated separately rather
        # than by a single "already done" flag. A run that uploaded the asset
        # and then died before committing the block must still merge on a
        # re-run; a run whose uploaded asset predates the current build must
        # upload again, or the merged block would not match the tarball.
        existing_digest=""
        if gh release view bottles >/dev/null 2>&1; then
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/bottles" \
            --jq '.assets[] | [.name, (.digest // "")] | @tsv' \
            > "${assets_tsv}" 2>/dev/null || true
          existing_digest=$(awk -F'\t' -v name="${filename}" '$1 == name { print $2 }' "${assets_tsv}")
        fi

        asset_ok=false
        if [[ "${existing_digest}" == "sha256:${sha256}" ]]; then
          asset_ok=true
        else
          echo "Release asset ${filename} is missing or differs from the built bottle"
        fi

        formula_ok=false
        if grep -qF "${sha256}" "Formula/${FORMULA}.rb"; then
          formula_ok=true
        else
          echo "Bottle ${sha256} is not in Formula/${FORMULA}.rb yet"
        fi

        # Only a complete pair is skipped. Merging a block whose tarball was not
        # uploaded in this run would leave the formula pointing at an asset with
        # a different checksum, so a missing half always redoes both.
        skip_upload="${asset_ok}"
        skip_merge=false
        if [[ "${asset_ok}" == "true" && "${formula_ok}" == "true" ]]; then
          skip_merge=true
        fi

        echo "skip_upload=${skip_upload} skip_merge=${skip_merge}"
        echo "skip_upload=${skip_upload}" >> "$GITHUB_OUTPUT"
        echo "skip_merge=${skip_merge}" >> "$GITHUB_OUTPUT"

    - name: Upload to release
      if: inputs.upload == 'true' && steps.idempotency.outputs.skip_upload != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        FORMULA: ${{ inputs.formula }}
      run: |
        set -euo pipefail
        json=$(ls ./*.bottle.json)
        filename=$(jq -r '.[].bottle.tags.x86_64_linux.filename' "$json")
        localname=$(jq -r '.[].bottle.tags.x86_64_linux.local_filename' "$json")

        gh release view bottles >/dev/null 2>&1 || \
          gh release create bottles --title "Bottles" --notes "Prebuilt bottles for Pake desktop apps"

        mv "$localname" "$filename"
        gh release upload bottles "$filename" --clobber

    - name: Merge bottle block into formula
      if: inputs.upload == 'true' && steps.idempotency.outputs.skip_merge != 'true'
      shell: bash
      env:
        FORMULA: ${{ inputs.formula }}
      run: |
        set -euo pipefail
        if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
          echo "Refusing to push a bottle commit from ${GITHUB_REF}; run this on main." >&2
          exit 1
        fi

        json=$(ls ./*.bottle.json)
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        brew bottle --merge --write --no-commit "$json"
        git add "Formula/${FORMULA}.rb"
        if git diff --cached --quiet; then
          echo "Formula ${FORMULA} already carries this bottle block"
          exit 0
        fi
        git commit -m "Add bottle for ${FORMULA}"

        # Several bottle workflows can finish at the same time, so a plain push
        # can be rejected as non-fast-forward. Rebase and retry instead.
        for attempt in 1 2 3 4 5; do
          if git push origin HEAD:main; then
            break
          fi
          if [[ "${attempt}" == "5" ]]; then
            echo "Could not push the bottle commit after ${attempt} attempts." >&2
            exit 1
          fi
          echo "Push rejected (attempt ${attempt}); rebasing onto origin/main." >&2
          git fetch origin main
          git rebase origin/main
          sleep $((attempt * 5))
        done

    - name: Prune old assets (keep 3 versions)
      if: inputs.upload == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        FORMULA: ${{ inputs.formula }}
      run: |
        set -euo pipefail
        gh release view bottles --json assets --jq '.assets[].name' \
          | grep "^${FORMULA}-" \
          | sed "s/^${FORMULA}-//; s/\.x86_64_linux\.bottle\..*//" \
          | sort -uV | head -n -3 > /tmp/old_versions.txt
        while read -r v; do
          [ -z "$v" ] && continue
          gh release delete-asset bottles "${FORMULA}-${v}.x86_64_linux.bottle.tar.gz" --yes 2>/dev/null || true
          gh release delete-asset bottles "${FORMULA}-${v}.x86_64_linux.bottle.json" --yes 2>/dev/null || true
        done < /tmp/old_versions.txt
