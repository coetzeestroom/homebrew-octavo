# brew tap-new uses this file to generate an autobump workflow for the new tap
name: brew bump

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/autobump.yml
  schedule:
    # Every day at 14:10 UTC
    - cron: 10 14 * * *

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  autobump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1

      # `brew bump --open-pr` pushes its branch before creating the PR. If the
      # PR API call fails, a retry would otherwise fail on that orphan branch.
      - name: Remove orphaned bump branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while read -r ref; do
            branch="${ref#refs/heads/}"
            [[ -n "$branch" ]] || continue

            pr_count="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" \
              --state all --json number --limit 1 --jq 'length')"
            if [[ "$pr_count" == "0" ]]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            fi
          done < <(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/bump-" --jq '.[].ref')

      - name: Bump formulae
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: brew bump --no-fork --open-pr --formulae --bump-synced --tap="$TAP_NAME"
