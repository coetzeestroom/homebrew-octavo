name: test herdr-desktop

on:
  push:
    branches:
      - main
    paths:
      - Formula/herdr-desktop.rb
  pull_request:
    paths:
      - Formula/herdr-desktop.rb
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-and-bottle:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out tap
        uses: actions/checkout@v4

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # 2026.11.09.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Trust the tap
        run: brew trust coetzeestroom/octavo

      - name: Style check
        run: brew style coetzeestroom/octavo/herdr-desktop

      - name: New-formula audit
        run: brew audit --new coetzeestroom/octavo/herdr-desktop

      - name: Livecheck
        run: brew livecheck coetzeestroom/octavo/herdr-desktop

      - name: Bottle build
        uses: ./.github/actions/bottle-build
        with:
          formula: herdr-desktop
          upload: ${{ github.event_name == 'push' }}
