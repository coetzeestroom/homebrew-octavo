name: Auto Merge PRs

on:
  pull_request:
    types:
      - opened
      - synchronize
      - labeled
  check_suite:
    types:
      - completed

jobs:
  automerge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge eligible pull requests
        uses: pascalgn/automerge-action@7961b8b5eec56cc088c140b56d864285eabd3f67 # v0.16.4
        env:
          GITHUB_TOKEN: ${{ secrets.BREW_PAT }}
          MERGE_LABELS: "automerge,!wip"
          MERGE_METHOD: "squash"
