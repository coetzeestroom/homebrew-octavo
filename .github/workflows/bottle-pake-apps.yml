name: bottle pake desktop apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Formula/*-desktop.rb

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  bottle:
    strategy:
      matrix:
        formula:
          - deepseek-harness-desktop
          # - ccr-desktop
          # - herdr-desktop
          # - hermes-desktop
          # - omnirouter-desktop
          # - openwebui-desktop
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/homebrew/brew:main
      options: --privileged
    steps:
      - name: Set up Homebrew
        id: setup
        uses: Homebrew/actions/setup-homebrew@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Trust the tap
        run: brew trust coetzeestroom/octavo

      - name: Install system build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev rustc cargo

      - name: Install with --build-bottle
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install --build-bottle coetzeestroom/octavo/${{ matrix.formula }}

      - name: Build bottle
        run: |
          cd "$(brew --repo coetzeestroom/octavo)"
          brew bottle --json --no-rebuild coetzeestroom/octavo/${{ matrix.formula }}

      - name: Upload bottle + json
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bottle-${{ matrix.formula }}
          path: |
            *.bottle.tar.gz
            *.bottle.json
