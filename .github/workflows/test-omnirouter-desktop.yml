name: test omnirouter-desktop

on:
  push:
    branches:
      - main
    paths:
      - Formula/omnirouter-desktop.rb
  pull_request:
    paths:
      - Formula/omnirouter-desktop.rb
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tap
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7 # 2026.11.23.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Trust the tap
        run: brew trust coetzeestroom/octavo

      - name: Style check
        run: brew style coetzeestroom/octavo/omnirouter-desktop

      - name: New-formula audit
        run: brew audit --new coetzeestroom/octavo/omnirouter-desktop

      - name: Livecheck
        run: brew livecheck coetzeestroom/octavo/omnirouter-desktop

      - name: Build from source
        uses: ./.github/actions/pake-build
        with:
          formula: omnirouter-desktop
