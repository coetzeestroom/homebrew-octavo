name: test omnirouter-desktop

on:
  push:
    branches:
      - main
    paths:
      - Formula/omnirouter-desktop.rb
  pull_request:
    paths:
      - Formula/omnirouter-desktop.rb
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the bottle to the bottles release and merge its block
        type: boolean
        default: true

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-and-bottle:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      pull-requests: read
    steps:
      - name: Check out tap
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Trust the tap
        run: brew trust coetzeestroom/octavo

      - name: Style check
        run: brew style coetzeestroom/octavo/omnirouter-desktop

      - name: New-formula audit
        run: brew audit --new coetzeestroom/octavo/omnirouter-desktop

      - name: Livecheck
        run: brew livecheck coetzeestroom/octavo/omnirouter-desktop

      - name: Bottle build
        uses: ./.github/actions/bottle-build
        with:
          formula: omnirouter-desktop
          upload: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.upload) }}
