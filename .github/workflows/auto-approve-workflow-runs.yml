name: Auto Approve Workflow Runs

on:
  workflow_dispatch:
  schedule:
    # Check for workflow runs awaiting approval every 10 minutes.
    - cron: "*/10 * * * *"

permissions: {}

jobs:
  approve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Approve pending autobump workflow runs
        uses: mheap/automatic-approve-action@3aa3fadcffe0603bea4a8e227087b135ee94fedd # v1
        with:
          token: ${{ secrets.BREW_PAT }}
          workflows: test-aoe-dashboard.yml,test-ccr-desktop.yml,test-ccr-service.yml,test-deepseek-harness-desktop.yml,test-herdr-desktop.yml,test-hermes-dashboard.yml,test-hermes-webui-desktop.yml,test-hermes-workspace-desktop.yml,test-kilo-desktop.yml,test-oh-my-bash.yml,test-oh-my-fish.yml,test-oh-my-zsh.yml,test-omnirouter-desktop.yml
